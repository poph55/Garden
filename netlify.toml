[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/mlb"
  to = "/.netlify/functions/mlb"
  status = 200

[[redirects]]
  from = "/api/subway"
  to = "/.netlify/functions/subway"
  status = 200

[[redirects]]
  from = "/pulsarnav"
  to = "/pulsarnav/index.html"
  status = 200

[[redirects]]
  from = "/pulsarnav/"
  to = "/pulsarnav/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/pulsarnav/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/garden-pattern.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
